[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-scoreboard-watch"
version = "0.1.0"
description = "Local web UI that reads CS2 TAB scoreboard screenshots, looks up players and scores anomalies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "onnxruntime>=1.20.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "rapidocr-onnxruntime>=1.4.0",
    "mss>=9.0.0; sys_platform != \"linux\"",
    "pynput>=1.7.6; sys_platform != \"linux\"",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cs2watch = "cs2watch.__main__:main"

[tool.setuptools]
# Explicit package list so that tests/, web/, scripts/ and the runtime data/ dir are not picked up.
packages = ["app", "cs2watch", "cs2platform", "lookup", "scoring", "sources", "storage", "vision"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["F", "E9", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "cs2watch", "cs2platform", "lookup", "scoring", "sources", "storage", "vision"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
